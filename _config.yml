# Welcome to Jekyll!
# Site Settings
locale                   : "en-US"
title                    : "Saikei Civil"
title_separator          : "—"
subtitle                 : "Native-IFC infrastructure authoring, contributed upstream"
name                     : "Saikei Civil"
description              : "Saikei Civil is the name Michael Yoder, PE gives to his contributions extending native-IFC authoring to civil infrastructure. The work is contributed upstream into Bonsai and IfcOpenShell under those projects' licenses."
url                      : "https://saikeicivil.org"
baseurl                  : ""
repository               : "saikeicivil/saikeicivil.github.io"
teaser                   : # path of fallback teaser image
logo                     : "/assets/images/logo.svg"
masthead_title           : "Saikei Civil"

# Site Author
author:
  name             : "Michael Yoder, PE"
  avatar           : # path of avatar image
  bio              : "PE contributing native-IFC infrastructure authoring upstream to Bonsai and IfcOpenShell."
  location         : "Meridian, Idaho"
  email            : 
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/company/saikeicivil"

# Site Footer
footer:
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://linkedin.com/company/saikeicivil"

# Reading Files
include:
  - _pages

# Build settings
remote_theme             : "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin    : "default" # We'll override with custom colors

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Exclude from processing
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Defaults
defaults:
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false
  # _posts (if you add a blog later)
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
